<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Otijot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav>
    <h1>Otijot</h1>
    <a href="table.html">Таблица букв</a>
    <span class="muted" id="status"></span>
  </nav>

  <textarea id="input" dir="rtl" placeholder="כתבו כאן…"></textarea>
  <div class="row">
    <button id="copy">Копировать</button>
    <label><input type="checkbox" id="random"> Случайно</label>
    <button id="reroll" hidden>🎲 Ещё раз</button>
    <span class="muted" id="copied"></span>
  </div>
  <div class="output" id="output" dir="rtl"></div>
  <p class="muted">
    По умолчанию — выбранный символ, а если не выбран, первый по приоритету.
    «Случайно» — любой из кандидатов буквы. Буквы без кандидатов остаются как есть.
  </p>
</main>
<script src="common.js"></script>
<script>
  (async () => {
    const { table, fromDraft } = await loadTable();
    const mapped = Object.values(table).filter((e) => e.candidates.length).length;
    document.getElementById("status").textContent =
      `${mapped}/${Object.keys(table).length} букв в таблице` + (fromDraft ? " (черновик)" : "");

    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const random = document.getElementById("random");
    const reroll = document.getElementById("reroll");
    let seed = null;
    const newSeed = () => Math.floor(Math.random() * 2 ** 31);
    const render = () => { output.textContent = transform(input.value, table, seed); };

    input.addEventListener("input", render);
    random.addEventListener("change", () => {
      seed = random.checked ? newSeed() : null;
      reroll.hidden = !random.checked;
      render();
    });
    reroll.addEventListener("click", () => { seed = newSeed(); render(); });
    render();

    document.getElementById("copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText(output.textContent);
      document.getElementById("copied").textContent = "Скопировано";
      setTimeout(() => { document.getElementById("copied").textContent = ""; }, 1500);
    });
  })();
</script>
</body>
</html>
